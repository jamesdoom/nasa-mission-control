name: Preview smoke

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: preview-smoke-${{ github.event.deployment.id }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment != 'Production' &&
      startsWith(github.event.deployment_status.environment_url, 'https://')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify preview critical routes and API contracts
        env:
          PRODUCTION_URL: ${{ github.event.deployment_status.environment_url }}
          SMOKE_REPORT: artifacts/preview-smoke.json
        run: node scripts/production-smoke.mjs
      - name: Upload preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-smoke-${{ github.event.deployment.id }}
          path: artifacts/preview-smoke.json
          if-no-files-found: error
          retention-days: 14
