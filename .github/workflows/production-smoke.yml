name: Production smoke

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check critical public routes and contracts
        env:
          PRODUCTION_URL: https://nasa-mission-control-alpha.vercel.app
        run: node scripts/production-smoke.mjs
      - name: Upload uptime and API evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-smoke
          path: artifacts/production-smoke.json
          if-no-files-found: error
          retention-days: 30
