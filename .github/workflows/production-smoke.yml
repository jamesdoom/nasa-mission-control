name: Production smoke

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check public health contract and SPA rewrite
        env:
          PRODUCTION_URL: https://nasa-mission-control-alpha.vercel.app
        run: node scripts/production-smoke.mjs
