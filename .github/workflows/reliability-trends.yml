name: Reliability trends

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: reliability-trends
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore the previous rolling history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while read -r previous; do
            if gh run download "$previous" --name reliability-history --dir artifacts/previous; then
              echo "Restored reliability history from completed run $previous."
              exit 0
            fi
          done < <(gh run list --workflow reliability-trends.yml --status completed --limit 10 --json databaseId --jq '.[].databaseId')
          echo "No previous reliability-history artifact was available; starting a new history."
      - name: Capture production evidence and evaluate thresholds
        run: npm run reliability:capture
      - name: Publish readable run summary
        if: always()
        run: cat artifacts/reliability-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain rolling history
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reliability-history
          path: |
            artifacts/reliability-history.json
            artifacts/reliability-summary.md
          retention-days: 90
          if-no-files-found: error
