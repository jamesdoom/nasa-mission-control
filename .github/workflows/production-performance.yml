name: Production performance

on:
  schedule:
    - cron: "43 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-performance
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore prior asset-budget trend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(gh run list --workflow production-performance.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [[ -n "$previous" ]]; then
            gh run download "$previous" --name production-performance --dir artifacts/previous
          fi
      - run: npm run build
      - name: Capture compressed asset-budget trend
        env:
          ASSET_BUDGET_REPORT: artifacts/asset-budget-trend.json
        run: npm run performance:budget
      - run: npx playwright install --with-deps chromium
      - name: Audit production dashboard and key content routes
        env:
          PRODUCTION_URL: https://nasa-mission-control-alpha.vercel.app
        run: npm run audit:production
      - name: Verify critical journeys and local continuity
        env:
          PRODUCTION_URL: https://nasa-mission-control-alpha.vercel.app
        run: npm run smoke:journeys
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-performance
          path: |
            artifacts/production-performance.json
            artifacts/production-journeys.json
            artifacts/production-journey-*.png
            artifacts/asset-budget-trend.json
          if-no-files-found: error
          retention-days: 30
