name: Product feedback
description: Share a usability observation or improvement idea without including private Flight Log data.
title: "[Feedback]: "
labels: []
body:
  - type: markdown
    attributes:
      value: "Thank you. Reports are public. Do not include private notes, saved records, API keys, or personal information."
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        [
          First visit,
          Live instruments,
          Mission Archive,
          Discovery and learning,
          Flight Log,
          Other,
        ]
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What were you trying to do?
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: What happened, and what would have helped?
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Route without private query values
      placeholder: /missions
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal information and private Flight Log content.
          required: true
