name: Accessibility report
description: Report a barrier with assistive-technology and reproduction context.
title: "[Accessibility]: "
labels: []
body:
  - type: markdown
    attributes:
      value: "Reports are public. Do not include health information, private Flight Log content, or other personal data."
  - type: input
    id: route
    attributes:
      label: Affected route
      placeholder: /learn
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        [
          Blocked from completing a task,
          Serious difficulty,
          Moderate difficulty,
          Minor friction,
        ]
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: Barrier and expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Browser, device, and assistive technology
      description: Share only details you are comfortable making public.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal information and private Flight Log content.
          required: true
